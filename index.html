<meta charset="utf-8">
<title>圖面工坊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#e9edf1;
    --surface:#ffffff;
    --surface-2:#f3f6f8;
    --surface-3:#e7ecf0;
    --ink:#18232e;
    --ink-dim:#5a6b7a;
    --ink-faint:#8899a8;
    --border:#d3dbe2;
    --border-strong:#b4c0cb;
    --accent:#b85c10;
    --accent-ink:#ffffff;
    --accent-soft:#fbe8d4;
    --ok:#1d7f4d;
    --ok-soft:#e0f2e8;
    --warn:#b8391f;
    --warn-soft:#fbe5e0;
    --info:#2b5f8f;
    --info-soft:#e2edf7;
    --shadow:0 1px 2px rgba(20,32,44,.06), 0 8px 22px rgba(20,32,44,.07);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f151b;
      --surface:#161e26;
      --surface-2:#1c2630;
      --surface-3:#243039;
      --ink:#e7eef4;
      --ink-dim:#94a5b4;
      --ink-faint:#6c7d8c;
      --border:#2a3540;
      --border-strong:#3a4753;
      --accent:#e0893b;
      --accent-ink:#161008;
      --accent-soft:#3a2915;
      --ok:#4fbc84;
      --ok-soft:#163125;
      --warn:#e2604a;
      --warn-soft:#3a1d18;
      --info:#6fa8dc;
      --info-soft:#17293a;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f151b; --surface:#161e26; --surface-2:#1c2630; --surface-3:#243039;
    --ink:#e7eef4; --ink-dim:#94a5b4; --ink-faint:#6c7d8c;
    --border:#2a3540; --border-strong:#3a4753;
    --accent:#e0893b; --accent-ink:#161008; --accent-soft:#3a2915;
    --ok:#4fbc84; --ok-soft:#163125; --warn:#e2604a; --warn-soft:#3a1d18;
    --info:#6fa8dc; --info-soft:#17293a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size:13px; line-height:1.5;
    padding-inline:16px;
  }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }

  /* ---------- toolbar ---------- */
  .toolbar{
    max-width:1500px; margin:0 auto; padding-block:14px 10px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; margin-right:auto; }
  .brand h1{ margin:0; font-size:19px; font-weight:700; letter-spacing:.02em; }
  .brand .sub{ font-size:11.5px; color:var(--ink-dim); }
  .savestate{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:999px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--ink-dim);
  }
  .savestate .led{ width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:none; }
  .savestate[data-s="dirty"]{ background:var(--info-soft); color:var(--info); border-color:transparent; }
  .savestate[data-s="dirty"] .led{ background:var(--info); }
  .savestate[data-s="saving"]{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
  .savestate[data-s="saving"] .led{ background:var(--accent); }
  .savestate[data-s="saved"]{ background:var(--ok-soft); color:var(--ok); border-color:transparent; }
  .savestate[data-s="saved"] .led{ background:var(--ok); }
  .savestate[data-s="error"]{ background:var(--warn-soft); color:var(--warn); border-color:transparent; }
  .savestate[data-s="error"] .led{ background:var(--warn); }

  button{ font-family:inherit; font-size:12.5px; }
  .btn{
    border:1px solid var(--border-strong); background:var(--surface);
    color:var(--ink); border-radius:6px; padding:7px 11px; font-weight:600; cursor:pointer;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover{ filter:brightness(1.06); background:var(--accent); }
  .btn.ghost{ background:transparent; border-color:var(--border); }
  .btn.sm{ padding:5px 8px; font-size:11.5px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }

  /* ---------- layout ---------- */
  .app{
    max-width:1500px; margin:0 auto; padding-block:0 32px;
    display:grid; grid-template-columns:210px 330px minmax(0,1fr); gap:14px;
    align-items:start;
  }
  @media (max-width:1180px){ .app{ grid-template-columns:200px minmax(0,1fr); } .col-preview{ grid-column:1 / -1; } }
  @media (max-width:760px){ .app{ grid-template-columns:1fr; } .col-preview{ grid-column:auto; } }

  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:9px; box-shadow:var(--shadow);
  }
  .card > header{
    padding:10px 12px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px; justify-content:space-between;
  }
  .card > header h2{
    margin:0; font-size:11.5px; font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--ink-dim);
  }
  .card .body{ padding:12px; }

  /* ---------- template rail ---------- */
  .filter-row{ padding:10px 12px; border-bottom:1px solid var(--border); }
  select, input[type=text], input[type=number], textarea{
    width:100%; padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px;
    background:var(--surface-2); color:var(--ink); font-family:inherit; font-size:12.5px;
  }
  .tpl-list{ list-style:none; margin:0; padding:8px; display:flex; flex-direction:column; gap:6px;
    max-height:640px; overflow-y:auto; }
  .tpl-item{
    display:grid; grid-template-columns:38px 1fr; gap:8px; align-items:center;
    padding:6px; border:1px solid var(--border); border-radius:7px;
    background:var(--surface-2); cursor:pointer; text-align:left; width:100%;
  }
  .tpl-item:hover{ border-color:var(--border-strong); }
  .tpl-item[aria-current="true"]{ border-color:var(--accent); background:var(--accent-soft); }
  .tpl-item img{ width:38px; height:52px; object-fit:cover; object-position:center 22%;
    background:#fff; border:1px solid var(--border); border-radius:3px; }
  .tpl-item .name{ font-size:11.5px; font-weight:700; font-family:"IBM Plex Mono",monospace; }
  .tpl-item .meta{ font-size:10.5px; color:var(--ink-dim); }
  .tpl-item .count{ font-size:10px; color:var(--ink-faint); }

  /* ---------- mode tabs ---------- */
  .tabs{ display:flex; gap:4px; padding:8px 8px 0; }
  .tab{
    flex:1; border:1px solid var(--border); border-bottom:none; background:var(--surface-2);
    color:var(--ink-dim); border-radius:6px 6px 0 0; padding:7px 6px; font-weight:700; cursor:pointer;
    font-size:12px;
  }
  .tab[aria-selected="true"]{ background:var(--surface); color:var(--ink); border-color:var(--border-strong); }

  .scroll-pane{ max-height:560px; overflow-y:auto; padding:12px; }

  /* ---------- dimension form ---------- */
  .dim-row{
    border:1px solid var(--border); border-radius:7px; padding:8px; margin-bottom:8px;
    background:var(--surface-2); cursor:pointer;
  }
  .dim-row[data-sel="true"]{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .dim-row .top{ display:flex; justify-content:space-between; align-items:baseline; gap:6px; margin-bottom:5px; }
  .dim-row .lbl{ font-weight:700; font-size:12.5px; }
  .dim-row .fid{ font-size:10px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; }
  .dim-row .req{ color:var(--warn); font-size:10.5px; font-weight:700; }
  .dim-grid{ display:grid; grid-template-columns:1.35fr .8fr .8fr; gap:6px; }
  .dim-grid label{ font-size:9.5px; color:var(--ink-dim); display:block; margin-bottom:2px; letter-spacing:.04em; }
  .dim-grid input{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  .dim-row input.empty-required{ border-color:var(--warn); background:var(--warn-soft); }
  .prefix-hint{ font-size:10px; color:var(--ink-faint); margin-top:4px; }

  .info-grid{ display:grid; gap:8px; }
  .info-grid label{ font-size:10px; color:var(--ink-dim); display:block; margin-bottom:3px; letter-spacing:.04em; font-weight:600; }

  .empty-note{
    padding:14px; border:1px dashed var(--border-strong); border-radius:7px;
    color:var(--ink-dim); font-size:12px; background:var(--surface-2);
  }

  /* ---------- settings ---------- */
  .set-block{ border:1px solid var(--border); border-radius:7px; margin-bottom:8px; background:var(--surface-2); }
  .set-block > .hd{ padding:7px 9px; display:flex; justify-content:space-between; align-items:center; gap:6px;
    border-bottom:1px solid var(--border); }
  .set-block > .hd .t{ font-weight:700; font-size:12px; }
  .set-block > .hd .t .fid{ font-size:10px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; font-weight:400; }
  .set-block[data-sel="true"]{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .set-body{ padding:9px; display:grid; gap:7px; }
  .g2{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .g3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; }
  .g4{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:7px; }
  .nudge{ display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
  .nudge .btn{ padding:4px 8px; }
  .chk{ display:flex; align-items:center; gap:6px; font-size:11.5px; }
  .chk input{ width:auto; }

  /* ---------- preview ---------- */
  .preview-head{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 12px;
    border-bottom:1px solid var(--border); }
  .zoomctl{ display:flex; align-items:center; gap:4px; margin-left:auto; }
  .zoomctl .z{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; min-width:44px; text-align:center; color:var(--ink-dim); }
  .stage{
    overflow:auto; background:var(--surface-3); padding:14px;
    max-height:74vh; display:flex; justify-content:safe center; overscroll-behavior:contain;
  }
  .sheet-wrap{ position:relative; flex:none; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.18);
    cursor:grab; touch-action:none; }
  .sheet-wrap svg{ display:block; }
  .sheet-wrap.marquee-on{ cursor:crosshair; }
  .sheet-wrap.panning{ cursor:grabbing; }
  #overlay .ov-mask{ cursor:move; }
  #overlay .ov-text, #overlay .ov-anchor{ cursor:move; }
  #overlay .ov-font{ cursor:nwse-resize; }
  #overlay .ov-handle[data-handle="nw"], #overlay .ov-handle[data-handle="se"]{ cursor:nwse-resize; }
  #overlay .ov-handle[data-handle="ne"], #overlay .ov-handle[data-handle="sw"]{ cursor:nesw-resize; }
  #overlay .ov-handle[data-handle="n"],  #overlay .ov-handle[data-handle="s"]{ cursor:ns-resize; }
  #overlay .ov-handle[data-handle="e"],  #overlay .ov-handle[data-handle="w"]{ cursor:ew-resize; }

  /* 浮動工具列 */
  .fab{
    position:absolute; transform:translateX(-50%); z-index:5;
    display:flex; align-items:center; gap:2px; padding:3px;
    background:var(--surface); border:1px solid var(--border-strong);
    border-radius:7px; box-shadow:0 4px 14px rgba(0,0,0,.22);
    white-space:nowrap;
  }
  .fab button{
    border:none; background:transparent; color:var(--ink);
    font-size:11.5px; font-weight:700; padding:4px 7px; border-radius:5px; cursor:pointer;
    font-family:"IBM Plex Sans",sans-serif; line-height:1.1;
  }
  .fab button:hover{ background:var(--accent-soft); color:var(--accent); }
  .fab .sep{ width:1px; height:16px; background:var(--border); display:inline-block; }
  .inline-edit{
    position:absolute; transform:translate(-50%,-50%); z-index:6; width:110px;
    text-align:center; font-family:"IBM Plex Mono",monospace; font-weight:600;
    border:2px solid var(--accent); border-radius:5px; padding:2px 4px;
    background:var(--surface); color:var(--ink);
  }

  /* 已改動標記 */
  .dot-changed{ width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; flex:none; }
  .revert{ border:none; background:transparent; color:var(--accent); font-size:10.5px;
    font-weight:700; cursor:pointer; padding:0 2px; text-decoration:underline; }
  .badge-row{ display:flex; gap:6px; flex-wrap:wrap; padding:8px 12px; border-top:1px solid var(--border); }
  .badge{ font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:999px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--ink-dim); }
  .badge.warn{ background:var(--warn-soft); color:var(--warn); border-color:transparent; }
  .badge.ok{ background:var(--ok-soft); color:var(--ok); border-color:transparent; }
  .badge.info{ background:var(--info-soft); color:var(--info); border-color:transparent; }

  .actions{ display:flex; gap:8px; flex-wrap:wrap; padding:10px 12px; border-top:1px solid var(--border); }

  /* ---------- modal ---------- */
  .modal-back{
    position:fixed; inset:0; background:rgba(12,18,24,.55); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .modal{
    background:var(--surface); border:1px solid var(--border-strong); border-radius:10px;
    box-shadow:0 18px 50px rgba(0,0,0,.35); max-width:min(760px,96vw); width:100%;
    max-height:88vh; display:flex; flex-direction:column;
  }
  .modal header{ padding:12px 14px; border-bottom:1px solid var(--border); display:flex;
    justify-content:space-between; align-items:center; gap:8px; }
  .modal header h3{ margin:0; font-size:14px; font-weight:700; }
  .modal .mbody{ padding:14px; overflow:auto; }
  .modal footer{ padding:10px 14px; border-top:1px solid var(--border); display:flex; gap:8px;
    justify-content:flex-end; flex-wrap:wrap; }
  .modal textarea{ width:100%; height:190px; font-family:"IBM Plex Mono",monospace; font-size:11px; }
  .modal img{ max-width:100%; border:1px solid var(--border); background:#fff; }
  .snap-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .snap-list li{ display:flex; gap:8px; align-items:center; justify-content:space-between;
    border:1px solid var(--border); border-radius:6px; padding:8px 10px; background:var(--surface-2); }
  .snap-list .nm{ font-weight:700; font-size:12.5px; }
  .snap-list .dt{ font-size:10.5px; color:var(--ink-dim); font-family:"IBM Plex Mono",monospace; }
  .msg{ padding:9px 11px; border-radius:6px; font-size:12px; font-weight:600; margin-bottom:10px; }
  .msg.warn{ background:var(--warn-soft); color:var(--warn); }
  .msg.info{ background:var(--info-soft); color:var(--info); }
  .msg.ok{ background:var(--ok-soft); color:var(--ok); }
  .msg ul{ margin:6px 0 0; padding-left:18px; font-weight:500; }

  #printArea{ display:none; }
  @media print{
    body > *:not(#printArea){ display:none !important; }
    body{ padding:0; background:#fff; }
    #printArea{ display:block; }
    #printArea img{ width:100%; height:auto; display:block; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<div class="toolbar">
  <div class="brand">
    <h1>圖面工坊</h1>
    <span class="sub">範本改尺寸 · 試作圖產出</span>
  </div>
  <span class="savestate" id="saveState" data-s="idle"><span class="led"></span><span id="saveText">準備中</span></span>
  <button class="btn ghost sm" id="undoBtn" title="復原上一步">復原</button>
  <button class="btn ghost sm" id="backupBtn">備份資料</button>
  <button class="btn ghost sm" id="importBtn">匯入備份</button>
</div>

<div class="app">
  <!-- ============ 左側：範本區 ============ -->
  <section class="card col-rail">
    <header><h2>範本</h2>
      <span style="display:flex;gap:6px;align-items:center">
        <span class="badge" id="tplCount">0</span>
        <button class="btn sm primary" id="addTplBtn" type="button">＋ 底圖</button>
      </span>
    </header>
    <div class="filter-row g2">
      <select id="machineFilter" aria-label="車台篩選"></select>
      <select id="partFilter" aria-label="類型篩選"></select>
    </div>
    <ul class="tpl-list" id="tplList"></ul>
  </section>

  <!-- ============ 中間：填寫 / 設定 ============ -->
  <section class="card col-form">
    <div class="tabs" role="tablist">
      <button class="tab" id="tabFill" role="tab" aria-selected="true">填寫尺寸</button>
      <button class="tab" id="tabSet" role="tab" aria-selected="false">設定範本</button>
    </div>
    <div class="scroll-pane" id="panel"></div>
  </section>

  <!-- ============ 右側：預覽 ============ -->
  <section class="card col-preview">
    <div class="preview-head">
      <strong id="pvTitle" class="mono">—</strong>
      <label class="chk"><input type="checkbox" id="compareChk"> 原圖對照</label>
      <div class="zoomctl">
        <button class="btn sm" id="zoomOut" aria-label="縮小">−</button>
        <span class="z" id="zoomVal">100%</span>
        <button class="btn sm" id="zoomIn" aria-label="放大">＋</button>
        <button class="btn sm" id="zoomFit">適合寬度</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="sheet-wrap" id="sheetWrap"></div>
    </div>
    <div class="badge-row" id="badgeRow"></div>
    <div class="actions">
      <button class="btn" id="saveSnapBtn">另存圖面</button>
      <button class="btn" id="openSnapBtn">開啟已存圖面</button>
      <button class="btn primary" id="pngBtn">下載 PNG</button>
      <button class="btn" id="printBtn">列印</button>
    </div>
  </section>
</div>

<div id="printArea"></div>
<div id="modalHost"></div>
<input type="file" id="fileInput" accept="application/json" hidden>
<input type="file" id="imgInput" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" hidden>

<script>
(function(){
"use strict";

/* ==========================================================================
   1. 底圖資產與預設範本主檔
   ── 要換成公司自己的圖組：替換 assets/ 內的 JPG 並改寫下方 SEED 即可，
      其餘程式不需更動。座標一律以原圖像素為準。
   ========================================================================== */

const px = (x,y,w,h)=>({x,y,w,h});

function field(o){
  return Object.assign({
    prefix:"", unit:"mm", defaultValue:"", defaultTolUpper:"", defaultTolLower:"",
    required:true, fontSize:30, orientation:0, tolPosition:"right"
  }, o);
}

// 三張同型（錐尖頂針）圖面共用的欄位語意，座標各自校準
const SEED = [
  {
    id:"D4P001000001", name:"D4P001000001", typeGroup:"錐尖頂針 P", typeCode:"D4P",
    asset:{ src:"assets/D4P001000001.jpg", w:1414, h:2000 },
    info:{ drawNo:"D4P001000001", material:"碳化鎢 VA70 1PC ／ 模殼 SKD11 1PC", rev:"R0", note:"" },
    frameRegion: px(40,1718,1345,272),
    extraMasks: [],
    fields:[
      field({id:"D_outer", label:"凸緣外徑", prefix:"Ø", defaultValue:"59.00", mask:px(666,288,96,40), text:{x:713,y:307}}),
      field({id:"D_mid",   label:"中段軸徑", prefix:"Ø", defaultValue:"47.00", mask:px(666,345,97,40), text:{x:714,y:364}}),
      field({id:"D_pilot", label:"導柱徑",   prefix:"Ø", defaultValue:"20",    mask:px(686,409,58,42), text:{x:714,y:429}}),
      field({id:"D_hole",  label:"中心孔徑", prefix:"Ø", defaultValue:"9.73",
             defaultTolUpper:"+0.01", defaultTolLower:"+0", tolPosition:"above",
             mask:px(675,461,81,87), text:{x:715,y:527}}),
      field({id:"R_nose",  label:"尖端內圓角", prefix:"R", defaultValue:"0.5", mask:px(753,569,62,44), text:{x:784,y:590}}),
      field({id:"H1", label:"段高 H1", defaultValue:"25",    orientation:-90, mask:px(986,732,38,36), text:{x:1005,y:750}}),
      field({id:"H2", label:"段高 H2", defaultValue:"34.00", orientation:-90, mask:px(1057,761,38,74), text:{x:1076,y:798}}),
      field({id:"H3", label:"段高 H3", defaultValue:"24.00", orientation:-90, mask:px(386,1124,40,78), text:{x:405,y:1162}}),
      field({id:"H4", label:"段高 H4", defaultValue:"33.00", orientation:-90, mask:px(386,1323,40,74), text:{x:405,y:1359}}),
      field({id:"H_total", label:"總長", defaultValue:"111.00", orientation:-90,

function buildTemplate(seed){
  const t = clone(seed);
  t.version = 1;
  t.fields = t.fields.map(f=>clone(f));
  return t;
}
function newDraft(tpl){
  const d = { templateId:tpl.id, template:clone(tpl), values:{}, info:clone(tpl.info), updatedAt:now() };
  tpl.fields.forEach(f=>{
    d.values[f.id] = { value:f.defaultValue, tolUpper:f.defaultTolUpper, tolLower:f.defaultTolLower };
  });
  return d;
}
function freshWorkspace(){
  const ws = { formatVersion:FORMAT_VERSION, templates:{}, drafts:{}, saved:[],
    ui:{ currentTemplateId:SEED[0].id, mode:"fill", selectedFieldId:null,
         machineFilter:"", partFilter:"", zoom:1, compare:false } };
  SEED.forEach(s=>{
    const t = buildTemplate(s);
    ws.templates[t.id] = t;
    ws.drafts[t.id] = newDraft(t);
  });
  ws.ui.selectedFieldId = ws.templates[SEED[0].id].fields[0]?.id || null;
  return ws;
}

/* ==========================================================================
   3. 本機保存（IndexedDB，去抖動 + 寫入佇列）
   ========================================================================== */

const store = (()=>{
  const DB="tu-workshop", STORE="workspace", UPLOADS="uploads", KEY="current";
  let dbp=null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      let req;
      try { req = indexedDB.open(DB,2); } catch(e){ rej(e); return; }
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE))   db.createObjectStore(STORE);
        if (!db.objectStoreNames.contains(UPLOADS)) db.createObjectStore(UPLOADS);
      };
      req.onsuccess = ()=> res(req.result);
      req.onerror  = ()=> rej(req.error);
    });
    return dbp;
  }
  function one(storeName, mode, fn){
    return open().then(db=> new Promise((res,rej)=>{
      const tx = db.transaction(storeName, mode);
      const r = fn(tx.objectStore(storeName));
      tx.oncomplete = ()=> res(r ? r.result : undefined);
      tx.onerror = ()=> rej(tx.error);
    }));
  }
  return {
    get:  ()=> one(STORE,"readonly",  s=> s.get(KEY)).then(v=> v||null),
    put:  (v)=> one(STORE,"readwrite", s=>{ s.put(v,KEY); }),
    getUpload: (id)=> one(UPLOADS,"readonly",  s=> s.get(id)),
    putUpload: (id,blob)=> one(UPLOADS,"readwrite", s=>{ s.put(blob,id); }),
    delUpload: (id)=> one(UPLOADS,"readwrite", s=>{ s.delete(id); }),
    listUploads: ()=> one(UPLOADS,"readonly", s=> s.getAllKeys())
  };
})();

let saveTimer=null, saveChain=Promise.resolve(), pendingSave=false;
function setSaveState(s, text){
  const el=document.getElementById("saveState");
  el.dataset.s=s; document.getElementById("saveText").textContent=text;
}
function scheduleSave(){
  pendingSave = true;
  setSaveState("dirty","尚有變更待保存");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    const payload = clone(ws);
    saveChain = saveChain.then(async ()=>{
      setSaveState("saving","正在保存");
      try{
        await store.put(payload);
        pendingSave = false;
        setSaveState("saved","已保存到本機");
      }catch(err){
        setSaveState("error","保存失敗，請備份資料");
      }
    });
  }, SAVE_DEBOUNCE);
}

/* ==========================================================================
   4. 影像載入（轉 data URI，避免匯出時 canvas 受污染）
   ========================================================================== */

const blobToDataURL = (blob)=> new Promise((res,rej)=>{
  const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error);
  fr.readAsDataURL(blob);
});

async function loadImage(src){
  if (imageCache.has(src)) return imageCache.get(src);
  const p = (async ()=>{
    let href = src;
    if (src.indexOf("upload:")===0){
      const blob = await store.getUpload(src.slice(7));
      if (!blob) throw new Error("uploaded image missing");
      href = await blobToDataURL(blob);
    } else {
      try{
        const resp = await fetch(src);
        if (resp.ok) href = await blobToDataURL(await resp.blob());
      }catch(e){ /* file:// 等情境退回直接載入 */ }
    }
    const img = new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=href; });
    return { img, href };
  })();
  imageCache.set(src,p);
  p.catch(()=> imageCache.delete(src));   // 失敗不要永久快取，重新上傳後才能再試
  return p;
}

   5. 合成計畫：預覽（SVG）與輸出（Canvas）共用同一份繪製資料
   ========================================================================== */

const measureCtx = document.createElement("canvas").getContext("2d");
const FONT = (size, weight)=> `${weight||500} ${size}px "IBM Plex Mono", ui-monospace, monospace`;
function measure(text,size,weight){ measureCtx.font = FONT(size,weight); return measureCtx.measureText(text).width; }

function valueText(f, v){
  const raw = (v && v.value!=null) ? String(v.value).trim() : "";
  if (!raw) return f.required ? "" : "—";
  return (f.prefix||"") + raw;
}

// 產生一個欄位的文字塊：主尺寸 + 公差（相對於文字中心的區域座標）
function fieldTextBlock(f, v){
  const main = valueText(f,v);
  const size = f.fontSize;
  const tolSize = Math.max(11, Math.round(size*0.5));
  const items = [{ text:main, size, weight:600, dx:0, dy:0, align:"center", baseline:"middle" }];
  const up = (v&&v.tolUpper||"").trim(), lo = (v&&v.tolLower||"").trim();
  if (up || lo){
    if (f.tolPosition==="above"){
      if (up) items.push({ text:up, size:tolSize, weight:500, dx:0, dy:-(size*0.62+tolSize*1.35), align:"center", baseline:"middle" });
      if (lo) items.push({ text:lo, size:tolSize, weight:500, dx:0, dy:-(size*0.62+tolSize*0.25), align:"center", baseline:"middle" });
    } else {
      const half = measure(main,size,600)/2 + tolSize*0.35;
      if (up) items.push({ text:up, size:tolSize, weight:500, dx:half, dy:-tolSize*0.62, align:"left", baseline:"middle" });
      if (lo) items.push({ text:lo, size:tolSize, weight:500, dx:half, dy: tolSize*0.62, align:"left", baseline:"middle" });
    }
  }
  return { x:f.text.x, y:f.text.y, rotate:f.orientation||0, items };
}

// 試作圖框：回傳矩形、框線與文字，供兩個渲染器共用
function buildFrame(region, info, tpl){
  const {x,y,w,h} = region;
  const rows = 3, rh = h/rows;
  const cells = [
    // row 1
    { c:[x,          y,        w*0.30, rh], k:"狀態",     v:"試作圖（非正式發行）" },
    { c:[x+w*0.30,   y,        w*0.26, rh], k:"圖號",     v:info.drawNo || "未填" },
    { c:[x+w*0.56,   y,        w*0.14, rh], k:"版次",     v:info.rev || "未填" },
    { c:[x+w*0.70,   y,        w*0.30, rh], k:"材質",     v:info.material || "未填" },
    // row 2
    { c:[x,          y+rh,     w*0.56, rh], k:"備註",     v:info.note || "—" },
    { c:[x+w*0.56,   y+rh,     w*0.26, rh], k:"來源檔名", v:tpl.asset.src.split("/").pop() },
    { c:[x+w*0.82,   y+rh,     w*0.18, rh], k:"範本版本", v:"v"+tpl.version },
    // row 3
    { c:[x,          y+rh*2,   w,      rh], k:"比例",     v:"不依比例，尺寸以標註為準；原圖簽核不延續至本衍生圖面" }
  ];
  return { rect:[x,y,w,h], cells };
}

function buildPlan(draft, opts){
  const tpl = draft.template;
  const masks = [];
  (tpl.extraMasks||[]).forEach(m=> masks.push({ id:m.id, kind:"extra", x:m.x, y:m.y, w:m.w, h:m.h }));
  tpl.fields.forEach(f=> masks.push({ id:f.id, kind:"field", x:f.mask.x, y:f.mask.y, w:f.mask.w, h:f.mask.h }));
  const texts = tpl.fields.map(f=> Object.assign({ fid:f.id }, fieldTextBlock(f, draft.values[f.id]||{})));
  return {
    asset: tpl.asset,
    masks,
    texts,
    frame: buildFrame(tpl.frameRegion, draft.info, tpl),
    original: !!(opts && opts.original)
  };
}

/* ---------- SVG 預覽 ---------- */
const esc = (s)=> String(s).replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));

function textItemsSVG(t){
  return t.items.filter(i=>i.text).map(it=>
    `<text x="${it.dx}" y="${it.dy}" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="${it.size}"`+
    ` font-weight="${it.weight}" fill="#101010" text-anchor="${it.align==="left"?"start":"middle"}"`+
    ` dominant-baseline="central">${esc(it.text)}</text>`
  ).join("");
}

// 圖面本體（輸出所見即所得）；互動用的控制點畫在另一層 overlay
function buildSheetSVG(plan, href){
  const {w,h} = plan.asset;
  const out = [];
  out.push(`<svg id="sheetSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`);
  out.push(`<image href="${esc(href)}" x="0" y="0" width="${w}" height="${h}"/>`);
  if (!plan.original){
    plan.masks.forEach(m=>
      out.push(`<rect id="mask-${esc(m.id)}" x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}" fill="#ffffff"/>`));
    plan.texts.forEach(t=>
      out.push(`<g id="txt-${esc(t.fid)}" transform="translate(${t.x} ${t.y}) rotate(${t.rotate})">${textItemsSVG(t)}</g>`));
    const fr = plan.frame;
    out.push(`<rect x="${fr.rect[0]}" y="${fr.rect[1]}" width="${fr.rect[2]}" height="${fr.rect[3]}" fill="#ffffff" stroke="#101010" stroke-width="3"/>`);
    fr.cells.forEach(cell=>{
      const [cx,cy,cw,ch] = cell.c;
      out.push(`<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" fill="none" stroke="#101010" stroke-width="1.5"/>`);
      out.push(`<text x="${cx+12}" y="${cy+26}" font-family="IBM Plex Sans, sans-serif" font-size="19" fill="#555555">${esc(cell.k)}</text>`);
      out.push(`<text x="${cx+12}" y="${cy+63}" font-family="IBM Plex Mono, monospace" font-size="29" font-weight="600" fill="#101010">${esc(clipText(cell.v, cw-24, 29))}</text>`);
    });
  }
  out.push(`<g id="overlay"></g>`);
  out.push(`</svg>`);
  return out.join("");
}

const HANDLES = [["nw",0,0],["n",.5,0],["ne",1,0],["e",1,.5],["se",1,1],["s",.5,1],["sw",0,1],["w",0,.5]];

// overlay：遮罩虛線框、必填未填標記、選取框與控制點、框選中的橡皮筋
function buildOverlaySVG(){
  if (ws.ui.compare) return "";
  const tpl = draftTpl(), d = curDraft();
  const sel = ws.ui.selectedFieldId;
  const k = 1/Math.max(ws.ui.zoom, .25);      // 讓控制點在任何縮放下都維持相同螢幕大小
  const out = [];

  tpl.fields.forEach(f=>{
    const v = d.values[f.id]||{};
    const missing = f.required && !String(v.value||"").trim();
    const changed = String(v.value||"") !== String(f.defaultValue||"");
    const color = missing ? "#c0341b" : (f.id===sel ? "#b85c10" : "#3f7cb8");
    out.push(`<rect class="ov-mask" data-fid="${esc(f.id)}" x="${f.mask.x}" y="${f.mask.y}" width="${f.mask.w}" height="${f.mask.h}"`+
      ` fill="transparent" stroke="${color}" stroke-width="${(missing?3:1.6)*k}" stroke-dasharray="${8*k} ${5*k}"/>`);
    if (missing){
      out.push(`<rect x="${f.mask.x}" y="${f.mask.y}" width="${f.mask.w}" height="${f.mask.h}" fill="#c0341b" fill-opacity=".10" pointer-events="none"/>`);
    }
    if (changed && !missing){
      out.push(`<circle cx="${f.mask.x+f.mask.w}" cy="${f.mask.y}" r="${5*k}" fill="#b85c10" stroke="#fff" stroke-width="${1.5*k}" pointer-events="none"/>`);
    }
  });
  (tpl.extraMasks||[]).forEach(m=>{
    out.push(`<rect x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}" fill="none" stroke="#8a93a0" stroke-width="${1.4*k}" stroke-dasharray="${4*k} ${4*k}" pointer-events="none"/>`);
  });
  if (ws.ui.mode==="set"){
    const fr = tpl.frameRegion;
    out.push(`<rect x="${fr.x}" y="${fr.y}" width="${fr.w}" height="${fr.h}" fill="none" stroke="#1d7f4d" stroke-width="${2*k}" stroke-dasharray="${12*k} ${6*k}" pointer-events="none"/>`);
  }

  const f = tpl.fields.find(x=>x.id===sel);
  if (f){
    const t = fieldTextBlock(f, d.values[f.id]||{});
    // 文字拖曳把手：貼著實際文字範圍，避免蓋住旁邊的欄位
    const ext = textExtent(t), pad = 4;
    out.push(`<g transform="translate(${t.x} ${t.y}) rotate(${t.rotate})">`+
      `<rect class="ov-text" data-fid="${esc(f.id)}" x="${ext.x0-pad}" y="${ext.y0-pad}"`+
      ` width="${ext.x1-ext.x0+pad*2}" height="${ext.y1-ext.y0+pad*2}" fill="transparent" stroke="#b85c10"`+
      ` stroke-width="${1.2*k}" stroke-dasharray="${3*k} ${3*k}"/></g>`);
    out.push(`<circle class="ov-anchor" data-fid="${esc(f.id)}" cx="${t.x}" cy="${t.y}" r="${6*k}" fill="#e07b1f" stroke="#fff" stroke-width="${2*k}"/>`);
    // 遮罩選取框與八個控制點
    out.push(`<rect x="${f.mask.x}" y="${f.mask.y}" width="${f.mask.w}" height="${f.mask.h}" fill="none" stroke="#b85c10" stroke-width="${2.4*k}" pointer-events="none"/>`);
    const s = 9*k;
    HANDLES.forEach(([name,fx,fy])=>{
      const hx = f.mask.x + f.mask.w*fx, hy = f.mask.y + f.mask.h*fy;
      out.push(`<rect class="ov-handle" data-handle="${name}" data-fid="${esc(f.id)}" x="${hx-s/2}" y="${hy-s/2}"`+
        ` width="${s}" height="${s}" fill="#ffffff" stroke="#b85c10" stroke-width="${1.8*k}"/>`);
    });
    // 字級把手
    const fh = fontHandlePos(f, t);
    out.push(`<circle class="ov-font" data-fid="${esc(f.id)}" cx="${fh.x}" cy="${fh.y}" r="${7*k}" fill="#2b5f8f" stroke="#fff" stroke-width="${2*k}"/>`);
  }

  if (marquee){
    const q = marquee;
    const x=Math.min(q.x0,q.x1), y=Math.min(q.y0,q.y1), mw=Math.abs(q.x1-q.x0), mh=Math.abs(q.y1-q.y0);
    out.push(`<rect id="marqueeRect" x="${x}" y="${y}" width="${mw}" height="${mh}" fill="rgba(184,92,16,.16)" stroke="#b85c10" stroke-width="${3*k}" pointer-events="none"/>`);
  }
  if (detected){
    out.push(`<rect x="${detected.mask.x}" y="${detected.mask.y}" width="${detected.mask.w}" height="${detected.mask.h}"`+
      ` fill="rgba(43,95,143,.12)" stroke="#2b5f8f" stroke-width="${2.5*k}" pointer-events="none"/>`);
    if (detected.tolBox){
      out.push(`<rect x="${detected.tolBox.x}" y="${detected.tolBox.y}" width="${detected.tolBox.w}" height="${detected.tolBox.h}"`+
        ` fill="none" stroke="#1d7f4d" stroke-width="${2*k}" stroke-dasharray="${5*k} ${4*k}" pointer-events="none"/>`);
    }
  }
  return out.join("");
}

// 文字區塊在自身座標系的範圍（含公差）
function textExtent(t){
  let x0=0, x1=0, y0=0, y1=0;
  t.items.forEach(it=>{
    if (!it.text) return;
    const w = measure(it.text, it.size, it.weight);
    const ax0 = (it.align==="left") ? it.dx : it.dx - w/2;
    x0 = Math.min(x0, ax0); x1 = Math.max(x1, ax0 + w);
    y0 = Math.min(y0, it.dy - it.size*0.62); y1 = Math.max(y1, it.dy + it.size*0.62);
  });
  if (x1<=x0){ x0=-10; x1=10; y0=-10; y1=10; }
  return { x0, x1, y0, y1 };
}

// 字級把手落在文字區塊右下角（隨方向旋轉）
function fontHandlePos(f, t){
  const dx = f.fontSize*2.0, dy = f.fontSize*0.95;
  const r = (t.rotate||0)*Math.PI/180;
  return { x: t.x + dx*Math.cos(r) - dy*Math.sin(r), y: t.y + dx*Math.sin(r) + dy*Math.cos(r) };
}

function clipText(text, maxW, size){
  let t = String(text);
  if (measure(t,size,600) <= maxW) return t;
  while (t.length>1 && measure(t+"…",size,600) > maxW) t = t.slice(0,-1);
  return t+"…";
}

/* ---------- Canvas 輸出 ---------- */
function planToCanvas(plan, img){
  const {w,h} = plan.asset;
  const cv = document.createElement("canvas");
  cv.width=w; cv.height=h;
  const ctx = cv.getContext("2d");
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);
  ctx.fillStyle="#ffffff";
  plan.masks.forEach(m=> ctx.fillRect(m.x,m.y,m.w,m.h));
  ctx.fillStyle="#101010";
  plan.texts.forEach(t=>{
    ctx.save();
    ctx.translate(t.x,t.y); ctx.rotate(t.rotate*Math.PI/180);
    t.items.forEach(it=>{
      if (!it.text) return;
      ctx.font = FONT(it.size,it.weight);
      ctx.textAlign = it.align==="left" ? "left" : "center";
      ctx.textBaseline = "middle";
      ctx.fillText(it.text, it.dx, it.dy);
    });
    ctx.restore();
  });
  const fr = plan.frame;
  ctx.fillStyle="#ffffff"; ctx.fillRect(fr.rect[0],fr.rect[1],fr.rect[2],fr.rect[3]);
  ctx.strokeStyle="#101010"; ctx.lineWidth=3; ctx.strokeRect(fr.rect[0],fr.rect[1],fr.rect[2],fr.rect[3]);
  fr.cells.forEach(cell=>{
    const [cx,cy,cw,ch]=cell.c;
    ctx.lineWidth=1.5; ctx.strokeRect(cx,cy,cw,ch);
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.fillStyle="#555555"; ctx.font='500 19px "IBM Plex Sans", sans-serif';
    ctx.fillText(cell.k, cx+12, cy+26);
    ctx.fillStyle="#101010"; ctx.font=FONT(29,600);
    ctx.fillText(clipText(cell.v, cw-24, 29), cx+12, cy+63);
  });
  return cv;
}

/* ==========================================================================
   6. 輸出前檢查
   ========================================================================== */
function validateForOutput(draft){
  const tpl = draft.template;
  const missing = tpl.fields.filter(f=>{
    const v = draft.values[f.id];
    return f.required && !(v && String(v.value||"").trim());
  }).map(f=>f.label+"（"+f.id+"）");
  const warnings = [];
  const note = (draft.info.note||"").trim();
  if (note && measure(note, 29, 600) > tpl.frameRegion.w*0.56*2 - 48) warnings.push("備註過長，建議縮短後再輸出。");
  if (!(draft.info.drawNo||"").trim()) warnings.push("圖號空白，圖框會顯示「未填」。");
  if (!(draft.info.material||"").trim()) warnings.push("材質空白，圖框會顯示「未填」。");
  return { missing, warnings, ok: missing.length===0 };
}

// 顯示用的分類文字：新範本用車台＋類型，舊資料仍用 typeGroup
function groupLabel(t){
  const bits = [t.machine, t.partType].filter(Boolean);
  return bits.length ? bits.join(" · ") : (t.typeGroup || "未分類");
}

function renderCategories(){
  const opts = (list, cur, allLabel)=>
    [`<option value="">${allLabel}</option>`]
      .concat(list.map(v=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(v)}</option>`))
      .join("");
  const used = (key)=> Array.from(new Set(
    Object.values(ws.templates).map(t=>t[key]).filter(Boolean)));
  // 選項＝預設清單 ∪ 資料裡實際出現過的值（匯入別人的備份時才不會漏）
  const machines = Array.from(new Set(MACHINES.concat(used("machine"))));
  const parts    = Array.from(new Set(PART_TYPES.concat(used("partType"))));
  $("machineFilter").innerHTML = opts(machines, ws.ui.machineFilter||"", "全部車台");
  $("partFilter").innerHTML    = opts(parts,    ws.ui.partFilter||"",    "全部類型");
}

function renderTemplateList(){
  const list = $("tplList");
  const mf = ws.ui.machineFilter||"", pf = ws.ui.partFilter||"";
  const items = Object.values(ws.templates).filter(t=>
    (!mf || t.machine===mf) && (!pf || t.partType===pf));
  $("tplCount").textContent = items.length + " 張";
  list.innerHTML = "";
  items.forEach(t=>{
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className="tpl-item"; b.type="button";
    b.setAttribute("aria-current", String(t.id===ws.ui.currentTemplateId));
    const upload = t.asset.src.indexOf("upload:")===0;
    b.innerHTML =
      `<img alt=""${upload ? "" : ` src="${esc(t.asset.src)}"`}>` +
      `<span><span class="name">${esc(t.name)}</span><br>` +
      `<span class="meta">${esc(groupLabel(t))}</span><br>` +
      `<span class="count">可填尺寸 ${t.fields.length}</span></span>`;
    if (upload){   // upload: 不是瀏覽器認得的網址，要先解析成 data URI
      const im = b.querySelector("img");
      loadImage(t.asset.src).then(r=>{ im.src = r.href; }).catch(()=>{ im.alt = "底圖遺失"; });

function switchTemplate(id){
  if (id===ws.ui.currentTemplateId) return;

  ws.ui.selectedFieldId = draftTpl().fields[0]?.id || null;
  ws.ui.compare = false;

  $("sheetWrap").classList.remove("marquee-on","panning");

  const d = curDraft(), tpl = d.template;

        `<div><label for="tu-${f.id}">上公差</label><input id="tu-${f.id}" type="text" value="${esc(v.tolUpper)}"></div>`+

      checkpoint();

    [["value",vi],["tolUpper",tu],["tolLower",tl]].forEach(([key,el])=>{
      el.addEventListener("focus", checkpoint);
      el.addEventListener("input", ()=>{
        const dd = curDraft();
        dd.values[f.id] = dd.values[f.id] || {value:"",tolUpper:"",tolLower:""};
        dd.values[f.id][key] = el.value;
        dd.updatedAt = now();
        if (key==="value") vi.classList.toggle("empty-required", f.required && !el.value.trim());
        updateFieldDOM(f.id); renderOverlay(); renderBadges(); scheduleSave();
      });
    });

  // 圖面資訊

  box.innerHTML =
    `<div class="hd"><span class="t">圖面資訊</span></div>`+
    `<div class="set-body info-grid">`+
      `<div><label for="i-drawNo">圖號</label><input id="i-drawNo" type="text" value="${esc(d.info.drawNo)}"></div>`+
      `<div><label for="i-material">材質</label><input id="i-material" type="text" value="${esc(d.info.material)}"></div>`+
      `<div class="g2">`+
        `<div><label for="i-rev">版次（手動）</label><input id="i-rev" type="text" value="${esc(d.info.rev)}"></div>`+
        `<div><label for="i-note">備註</label><input id="i-note" type="text" value="${esc(d.info.note)}"></div>`+
      `</div>`+
    `</div>`;
  host.appendChild(box);
  ["drawNo","material","rev","note"].forEach(k=>{
    const el = $("i-"+k);
    el.addEventListener("focus", checkpoint);
    el.addEventListener("input", ()=>{
      curDraft().info[k]=el.value; curDraft().updatedAt=now();
      renderPreview(); renderBadges(); scheduleSave();
    });
  });
}

    host.appendChild(blk);

}

function wireFieldSettings(f){
  const tplField = ()=> draftTpl().fields.find(x=>x.id===f.id);
  const num = (el)=>{ const n=parseFloat(el.value); return isFinite(n)?n:null; };

  [["s-label-","label"],["s-unit-","unit"]].forEach(([p,key])=>{
    const el=$(p+f.id); if(!el) return;
    el.addEventListener("focus", checkpoint);
    el.addEventListener("input", ()=>{ tplField()[key]=el.value; renderPreview(); scheduleSave(); });
  });
  const pfxEl = $("s-prefix-"+f.id);
  pfxEl.addEventListener("change", ()=>{
    checkpoint();
    tplField().prefix = pfxEl.value;
    updateFieldDOM(f.id); renderOverlay(); scheduleSave();
  });

  // 預設值／預設公差：同時更新目前草稿（規格 §5）
  [["s-default-","defaultValue","value"],["s-tu-","defaultTolUpper","tolUpper"],["s-tl-","defaultTolLower","tolLower"]]
  .forEach(([p,tkey,vkey])=>{
    const el=$(p+f.id); if(!el) return;
    el.addEventListener("focus", checkpoint);
    el.addEventListener("input", ()=>{
      tplField()[tkey]=el.value;
      const d=curDraft();
      d.values[f.id]=d.values[f.id]||{value:"",tolUpper:"",tolLower:""};
      d.values[f.id][vkey]=el.value; d.updatedAt=now();
      renderPreview(); renderBadges(); scheduleSave();
    });
  });

  const fontEl=$("s-font-"+f.id);
  fontEl.addEventListener("focus", checkpoint);
  fontEl.addEventListener("input", ()=>{
    const n=num(fontEl);
    if (n===null || n<8 || n>120){ fontEl.setCustomValidity("請輸入 8–120 的字級"); fontEl.reportValidity?.(); return; }
    fontEl.setCustomValidity("");
    tplField().fontSize=n; renderPreview(); scheduleSave();
  });

  ["s-orient-","s-tolpos-"].forEach(p=>{
    const el=$(p+f.id);
    el.addEventListener("change", ()=>{
      checkpoint();
      if (p==="s-orient-") tplField().orientation = parseInt(el.value,10);
      else tplField().tolPosition = el.value;
      renderPreview(); scheduleSave();
    });
  });

  const asset = ()=> draftTpl().asset;
  [["s-mx-","mask","x"],["s-my-","mask","y"],["s-mw-","mask","w"],["s-mh-","mask","h"],
   ["s-tx-","text","x"],["s-ty-","text","y"]].forEach(([p,grp,key])=>{
    const el=$(p+f.id);
    el.addEventListener("focus", checkpoint);
    el.addEventListener("input", ()=>{
      const n=num(el); if (n===null) return;
      const lim = (key==="x"||key==="w") ? asset().w : asset().h;
      const v = Math.max((grp==="mask"&&(key==="w"||key==="h"))?4:0, Math.min(n, lim));
      tplField()[grp][key]=v;
      renderPreview(); scheduleSave();
    });
  });

  const reqEl=$("s-req-"+f.id);
  reqEl.addEventListener("change", ()=>{ checkpoint(); tplField().required=reqEl.checked; renderPanel(); renderBadges(); scheduleSave(); });
}

// 事件代理：移除欄位 / 微調 / 置中
document.addEventListener("click",(e)=>{
  const del = e.target.closest("[data-del]");
  if (del){
    checkpoint();
    const id = del.getAttribute("data-del");
    const t = draftTpl();
    t.fields = t.fields.filter(x=>x.id!==id);
    delete curDraft().values[id];
    if (ws.ui.selectedFieldId===id) ws.ui.selectedFieldId = t.fields[0]?.id || null;
    renderPanel(); renderPreview(); renderBadges(); scheduleSave();
    return;
  }
  const nd = e.target.closest("[data-nudge]");
  if (nd){
    checkpoint();
    const [id,dx,dy] = nd.getAttribute("data-nudge").split(":");
    const f = draftTpl().fields.find(x=>x.id===id);
    if (f){ f.text.x += parseInt(dx,10); f.text.y += parseInt(dy,10); renderPanel(); renderPreview(); scheduleSave(); }
    return;
  }
  const ct = e.target.closest("[data-center]");
  if (ct){
    checkpoint();
    const f = draftTpl().fields.find(x=>x.id===ct.getAttribute("data-center"));
    if (f){ f.text.x = Math.round(f.mask.x+f.mask.w/2); f.text.y = Math.round(f.mask.y+f.mask.h/2);
      renderPanel(); renderPreview(); scheduleSave(); }
  }
});

function renderPanel(){
  $("tabFill").setAttribute("aria-selected", String(ws.ui.mode==="fill"));
  $("tabSet").setAttribute("aria-selected", String(ws.ui.mode==="set"));
  if (ws.ui.mode==="fill") renderFillPanel(); else renderSetPanel();
}

/* ---------- 預覽 ---------- */
let previewToken = 0;

function applyZoomSize(){
  const tpl = draftTpl();
  const svg = $("sheetSvg"); if (!svg) return;
  const w = Math.round(tpl.asset.w*ws.ui.zoom), h = Math.round(tpl.asset.h*ws.ui.zoom);
  svg.setAttribute("width", w); svg.setAttribute("height", h);
  $("sheetWrap").style.width = w+"px";
  $("sheetWrap").style.height = h+"px";
}

function renderOverlay(){
  const g = $("overlay");
  if (g) g.innerHTML = buildOverlaySVG();
  positionFab();
}

// 只更新單一欄位的遮罩與文字，不重建整張圖（拖曳時用）
function updateFieldDOM(fid){
  const f = draftTpl().fields.find(x=>x.id===fid); if (!f) return;
  const rect = document.getElementById("mask-"+fid);
  if (rect){
    rect.setAttribute("x", f.mask.x); rect.setAttribute("y", f.mask.y);
    rect.setAttribute("width", f.mask.w); rect.setAttribute("height", f.mask.h);
  }
  const g = document.getElementById("txt-"+fid);
  if (g){
    const t = fieldTextBlock(f, curDraft().values[fid]||{});
    g.setAttribute("transform", `translate(${t.x} ${t.y}) rotate(${t.rotate})`);
    g.innerHTML = textItemsSVG(t);
  }
}

async function renderPreview(){
  const token = ++previewToken;
  const d = curDraft(), tpl = d.template;
  $("pvTitle").textContent = tpl.name + "　" + (d.info.drawNo||"未填圖號");
  $("zoomVal").textContent = Math.round(ws.ui.zoom*100)+"%";
  $("compareChk").checked = !!ws.ui.compare;

  const wrap = $("sheetWrap");
  let href;
  try { href = (await loadImage(tpl.asset.src)).href; }
  catch(e){ wrap.innerHTML = `<div style="padding:24px;color:#b8391f">底圖載入失敗：${esc(tpl.asset.src)}</div>`; return; }
  if (token!==previewToken) return;

  const plan = buildPlan(d, { original: !!ws.ui.compare });
  wrap.innerHTML = buildSheetSVG(plan, href) + FAB_HTML;
  applyZoomSize();
  renderOverlay();
  wrap.classList.toggle("marquee-on", !!marqueeMode);
}

function renderBadges(){
  const d = curDraft();
  const r = validateForOutput(d);
  const host = $("badgeRow");
  const bits = [];
  bits.push(`<span class="badge">可填尺寸 ${d.template.fields.length}</span>`);
  bits.push(`<span class="badge">範本 v${d.template.version}</span>`);
  bits.push(`<span class="badge">已存圖面 ${ws.saved.filter(s=>s.draft.templateId===d.templateId).length}</span>`);
  if (r.missing.length) bits.push(`<span class="badge warn">必填未完成 ${r.missing.length}</span>`);
  else bits.push(`<span class="badge ok">必填已完成</span>`);
  if (ws.ui.compare) bits.push(`<span class="badge info">原圖對照中（輸出仍為衍生圖）</span>`);
  if (marqueeMode==="frame") bits.push(`<span class="badge info">框選圖框範圍：框住原圖下方要被蓋掉的標題欄，Esc 取消</span>`);
  else if (marqueeMode==="mask") bits.push(`<span class="badge info">框選額外遮罩：框住要蓋掉的舊內容，Esc 取消</span>`);
  else if (marqueeMode) bits.push(`<span class="badge info">框選中：拖出範圍後自動辨識格式，Esc 取消</span>`);
  else bits.push(`<span class="badge">點標註可選取 · 拖曳移動 · 控制點改遮罩 · 方向鍵微調 · 雙擊改值 · Ctrl+滾輪縮放</span>`);
  host.innerHTML = bits.join("");
}

function renderAll(){
  renderCategories(); renderTemplateList();
  $("undoBtn").disabled = undoStack.length===0;
  if (!curDraft()){
    $("panel").innerHTML = `<div class="empty-note">目前沒有範本。按右上角「＋ 底圖」上傳一張圖面開始。</div>`;
    $("sheetWrap").innerHTML = ""; $("sheetWrap").style.width = "auto";
    $("pvTitle").textContent = "—";
    $("badgeRow").innerHTML = `<span class="badge">尚無範本</span>`;
    return;
  }
  renderPanel(); renderPreview(); renderBadges();
}

/* ==========================================================================
   8. 圖上直接操作：選取、拖曳、控制點、浮動工具列、就地編輯、框選辨識
   ========================================================================== */
let marqueeMode = null;   // 'field' | 'mask' | null
let detected = null;      // 框選自動辨識結果（供 overlay 顯示）
let drag = null;          // 進行中的拖曳
let inlineFid = null;     // 就地編輯中的欄位
let lastNudgeAt = 0;

const FAB_HTML =
  `<div class="fab" id="fab" hidden>`+
    `<button type="button" data-fab="font-" title="縮小字級">A−</button>`+
    `<button type="button" data-fab="font+" title="放大字級">A+</button>`+
    `<i class="sep"></i>`+
    `<button type="button" data-fab="rot0" title="水平">→</button>`+
    `<button type="button" data-fab="rot-90" title="直向向上">↑</button>`+
    `<button type="button" data-fab="rot90" title="直向向下">↓</button>`+
    `<i class="sep"></i>`+
    `<button type="button" data-fab="tol" title="切換公差位置">公差</button>`+
    `<button type="button" data-fab="center" title="文字置中到遮罩">置中</button>`+
    `<button type="button" data-fab="edit" title="就地修改數值">改值</button>`+
    `<button type="button" data-fab="del" title="移除此欄位">刪除</button>`+
  `</div>`+
  `<input class="inline-edit" id="inlineEdit" hidden>`;

const clamp = (v,lo,hi)=> Math.max(lo, Math.min(hi, v));
const fieldById = (id)=> id ? draftTpl().fields.find(f=>f.id===id) : null;

function positionFab(){
  const fab = $("fab"); if (!fab) return;
  const f = fieldById(ws.ui.selectedFieldId);
  if (!f || ws.ui.compare || inlineFid || drag){ fab.hidden = true; return; }
  const z = ws.ui.zoom;
  const t = fieldTextBlock(f, curDraft().values[f.id]||{});
  let top = f.mask.y*z - 42;
  if (top < 2) top = (f.mask.y + f.mask.h)*z + 10;
  fab.style.left = (t.x*z)+"px";
  fab.style.top  = top+"px";
  fab.hidden = false;
}

function startMarquee(kind){
  marqueeMode = kind; marquee = null; detected = null;
  ws.ui.selectedFieldId = null;
  renderOverlay(); renderBadges();
  $("sheetWrap").classList.add("marquee-on");
}
function cancelMarquee(){
  if (!marqueeMode && !marquee && !detected) return;
  marqueeMode = null; marquee = null; detected = null;
  $("sheetWrap").classList.remove("marquee-on");
  renderOverlay(); renderBadges();
}

function toImageCoords(evt){
  const svg = $("sheetSvg"); if (!svg) return null;
  const r = svg.getBoundingClientRect();
  const tpl = draftTpl();
  return {
    x: Math.round((evt.clientX-r.left)/r.width  * tpl.asset.w),
    y: Math.round((evt.clientY-r.top )/r.height * tpl.asset.h)
  };
}

/* ---------- 拖曳 ---------- */
$("sheetWrap").addEventListener("pointerdown",(e)=>{
  if (e.target.closest(".fab") || e.target.closest(".inline-edit")) return;
  if (inlineFid) commitInline();
  const p = toImageCoords(e); if (!p) return;

  if (marqueeMode){
    marquee = { x0:p.x, y0:p.y, x1:p.x, y1:p.y };
    drag = { mode:"marquee" };
    $("sheetWrap").setPointerCapture?.(e.pointerId);
    renderOverlay();
    return;
  }

  const el = e.target, cls = el.classList || { contains:()=>false };
  const fid = el.dataset ? el.dataset.fid : null;

  if (cls.contains("ov-handle") && fid){
    const f = fieldById(fid);
    drag = { mode:"mask", fid, handle:el.dataset.handle, start:p, orig:Object.assign({},f.mask) };
  } else if (cls.contains("ov-font") && fid){
    const f = fieldById(fid);
    drag = { mode:"font", fid, start:p, orig:f.fontSize };
  } else if (fid && (cls.contains("ov-text") || cls.contains("ov-anchor") || cls.contains("ov-mask"))){
    if (ws.ui.selectedFieldId !== fid) selectField(fid);
    const f = fieldById(fid);
    drag = { mode:"text", fid, start:p, orig:Object.assign({},f.text) };
  } else {
    if (ws.ui.selectedFieldId){ ws.ui.selectedFieldId = null; renderOverlay(); }
    const st = $("stage");
    drag = { mode:"pan", startClient:{x:e.clientX,y:e.clientY}, startScroll:{l:st.scrollLeft, t:st.scrollTop} };
    $("sheetWrap").classList.add("panning");
  }
  $("sheetWrap").setPointerCapture?.(e.pointerId);
  if (drag.mode!=="pan") positionFab();
});

$("sheetWrap").addEventListener("pointermove",(e)=>{
  if (!drag) return;

  if (drag.mode==="pan"){
    const st = $("stage");
    st.scrollLeft = drag.startScroll.l - (e.clientX - drag.startClient.x);
    st.scrollTop  = drag.startScroll.t - (e.clientY - drag.startClient.y);
    return;
  }
  const p = toImageCoords(e); if (!p) return;

  if (drag.mode==="marquee"){
    marquee.x1=p.x; marquee.y1=p.y;
    const r = document.getElementById("marqueeRect");
    if (r){
      r.setAttribute("x", Math.min(marquee.x0,marquee.x1));
      r.setAttribute("y", Math.min(marquee.y0,marquee.y1));
      r.setAttribute("width", Math.abs(marquee.x1-marquee.x0));
      r.setAttribute("height", Math.abs(marquee.y1-marquee.y0));
    } else renderOverlay();
    return;
  }

  const f = fieldById(drag.fid); if (!f) return;
  if (!drag.checkpointed){ checkpoint(); drag.checkpointed = true; }
  const A = draftTpl().asset;
  const dx = p.x - drag.start.x, dy = p.y - drag.start.y;

  if (drag.mode==="text"){
    f.text.x = clamp(drag.orig.x + dx, 0, A.w);
    f.text.y = clamp(drag.orig.y + dy, 0, A.h);
  } else if (drag.mode==="mask"){
    const H = drag.handle, o = drag.orig;
    let x=o.x, y=o.y, w=o.w, h=o.h;
    if (H.indexOf("w")>=0){ x = o.x + dx; w = o.w - dx; }
    if (H.indexOf("e")>=0){ w = o.w + dx; }
    if (H.indexOf("n")>=0){ y = o.y + dy; h = o.h - dy; }
    if (H.indexOf("s")>=0){ h = o.h + dy; }
    if (w < 6){ w = 6; if (H.indexOf("w")>=0) x = o.x + o.w - 6; }
    if (h < 6){ h = 6; if (H.indexOf("n")>=0) y = o.y + o.h - 6; }
    f.mask.x = clamp(Math.round(x),0,A.w); f.mask.y = clamp(Math.round(y),0,A.h);
    f.mask.w = clamp(Math.round(w),6,A.w); f.mask.h = clamp(Math.round(h),6,A.h);
  } else if (drag.mode==="font"){
    const r = (f.orientation||0)*Math.PI/180;
    const along = dx*Math.cos(r) + dy*Math.sin(r);
    f.fontSize = clamp(Math.round(drag.orig + along/2), 8, 120);
  }
  updateFieldDOM(drag.fid);
  renderOverlay();
});

$("sheetWrap").addEventListener("pointerup",(e)=>{
  if (!drag) return;
  const mode = drag.mode;
  $("sheetWrap").classList.remove("panning");
  if (mode==="marquee"){ drag=null; finishMarquee(); return; }
  drag = null;
  positionFab();
  if (mode==="pan") return;
  curDraft().updatedAt = now();
  const sp = $("panel").scrollTop;
  renderPanel(); $("panel").scrollTop = sp;
  renderOverlay(); renderBadges(); scheduleSave();
});
$("sheetWrap").addEventListener("pointercancel", ()=>{ drag=null; $("sheetWrap").classList.remove("panning"); positionFab(); });

/* ---------- 浮動工具列 ---------- */
$("sheetWrap").addEventListener("click",(e)=>{
  const btn = e.target.closest("[data-fab]"); if (!btn) return;
  const f = fieldById(ws.ui.selectedFieldId); if (!f) return;
  const act = btn.getAttribute("data-fab");
  if (act==="edit"){ startInlineEdit(f.id); return; }
  checkpoint();
  if (act==="font-") f.fontSize = clamp(f.fontSize-2, 8, 120);
  else if (act==="font+") f.fontSize = clamp(f.fontSize+2, 8, 120);
  else if (act==="rot0") f.orientation = 0;
  else if (act==="rot-90") f.orientation = -90;
  else if (act==="rot90") f.orientation = 90;
  else if (act==="tol") f.tolPosition = (f.tolPosition==="right" ? "above" : "right");
  else if (act==="center"){ f.text.x = Math.round(f.mask.x+f.mask.w/2); f.text.y = Math.round(f.mask.y+f.mask.h/2); }
  else if (act==="del"){
    const id=f.id, t=draftTpl();
    t.fields = t.fields.filter(x=>x.id!==id);
    delete curDraft().values[id];
    ws.ui.selectedFieldId = t.fields[0]?.id || null;
    renderPanel(); renderPreview(); renderBadges(); scheduleSave();
    return;
  }
  updateFieldDOM(f.id);
  const sp=$("panel").scrollTop; renderPanel(); $("panel").scrollTop=sp;
  renderOverlay(); scheduleSave();
});

/* ---------- 就地編輯 ---------- */
function startInlineEdit(fid){
  const f = fieldById(fid); if (!f) return;
  inlineFid = fid;
  const inp = $("inlineEdit");
  const v = curDraft().values[fid] || {};
  const t = fieldTextBlock(f, v);
  const z = ws.ui.zoom;
  inp.value = v.value || "";
  inp.style.left = (t.x*z)+"px";
  inp.style.top  = (t.y*z)+"px";
  inp.style.fontSize = clamp(Math.round(f.fontSize*z), 12, 30)+"px";
  inp.hidden = false;
  positionFab();
  inp.focus(); inp.select();
}
function commitInline(){
  if (!inlineFid) return;
  const fid = inlineFid, val = $("inlineEdit").value;
  inlineFid = null;
  $("inlineEdit").hidden = true;
  const d = curDraft();
  const cur = d.values[fid] || {value:"",tolUpper:"",tolLower:""};
  if (cur.value !== val){
    checkpoint();
    d.values[fid] = Object.assign({}, cur, {value:val});
    d.updatedAt = now();
    updateFieldDOM(fid);
    const sp=$("panel").scrollTop; renderPanel(); $("panel").scrollTop=sp;
    renderBadges(); scheduleSave();
  }
  renderOverlay();
}
function cancelInline(){
  if (!inlineFid) return;
  inlineFid = null; $("inlineEdit").hidden = true; renderOverlay();
}
$("sheetWrap").addEventListener("keydown",(e)=>{
  if (!inlineFid) return;
  if (e.key==="Enter"){ e.preventDefault(); commitInline(); }
  else if (e.key==="Escape"){ e.preventDefault(); cancelInline(); }
});
$("sheetWrap").addEventListener("focusout",(e)=>{
  if (inlineFid && e.target.id==="inlineEdit") commitInline();
});
$("sheetWrap").addEventListener("dblclick",(e)=>{
  const fid = e.target.dataset ? e.target.dataset.fid : null;
  if (fid) startInlineEdit(fid);
});

/* ---------- 鍵盤微調 ---------- */
document.addEventListener("keydown",(e)=>{
  if (e.key==="Escape"){
    if (inlineFid) cancelInline();
    else if (marqueeMode || marquee || detected) cancelMarquee();
    else if (ws.ui.selectedFieldId){ ws.ui.selectedFieldId=null; renderOverlay(); }
    return;
  }
  if (inlineFid) return;
  const tag = (e.target.tagName||"").toLowerCase();
  if (tag==="input" || tag==="textarea" || tag==="select") return;
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].indexOf(e.key)<0) return;
  const f = fieldById(ws.ui.selectedFieldId); if (!f) return;
  e.preventDefault();
  const step = e.shiftKey ? 10 : 1;
  const t = Date.now();
  if (t - lastNudgeAt > 800){ checkpoint(); }
  lastNudgeAt = t;
  if (e.key==="ArrowLeft") f.text.x -= step;
  if (e.key==="ArrowRight") f.text.x += step;
  if (e.key==="ArrowUp") f.text.y -= step;
  if (e.key==="ArrowDown") f.text.y += step;
  updateFieldDOM(f.id); renderOverlay();
  const sp=$("panel").scrollTop; renderPanel(); $("panel").scrollTop=sp;
  scheduleSave();
});

/* ---------- 縮放：以游標為中心 ---------- */
function fitWidth(){
  const st = $("stage");
  const avail = st.clientWidth - 30;              // 扣掉左右留白
  const z = clamp(avail / draftTpl().asset.w, 0.25, 2);
  setZoom(z);
}
function setZoom(next, clientX, clientY){
  const before = ws.ui.zoom;
  next = clamp(+next.toFixed(3), 0.25, 2);
  if (next===before) return;
  const st = $("stage"), r = st.getBoundingClientRect();
  const ax = (clientX==null ? r.width/2  : clientX - r.left);
  const ay = (clientY==null ? r.height/2 : clientY - r.top);
  const cx = st.scrollLeft + ax, cy = st.scrollTop + ay;
  ws.ui.zoom = next;
  applyZoomSize(); renderOverlay();
  st.scrollLeft = cx*(next/before) - ax;
  st.scrollTop  = cy*(next/before) - ay;
  $("zoomVal").textContent = Math.round(next*100)+"%";
  scheduleSave();
}
$("stage").addEventListener("wheel",(e)=>{
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  setZoom(ws.ui.zoom * (e.deltaY<0 ? 1.15 : 1/1.15), e.clientX, e.clientY);
}, { passive:false });

/* ---------- 框選結束 → 自動辨識 ---------- */
async function finishMarquee(){
  const x=Math.min(marquee.x0,marquee.x1), y=Math.min(marquee.y0,marquee.y1);
  const w=Math.abs(marquee.x1-marquee.x0), h=Math.abs(marquee.y1-marquee.y0);
  const kind = marqueeMode;
  marqueeMode = null; marquee = null;
  $("sheetWrap").classList.remove("marquee-on");

  if (w<MIN_MARQUEE || h<MIN_MARQUEE){
    renderOverlay(); renderBadges();
    toast("框選範圍太小，未建立欄位或遮罩。","warn");
    return;
  }
  if (kind==="mask"){
    checkpoint();
    draftTpl().extraMasks.push({ id:uid("mask"), x,y,w,h });
    renderPanel(); renderPreview(); scheduleSave();
    return;
  }
  if (kind==="frame"){
    checkpoint();
    draftTpl().frameRegion = { x, y, w, h };
    renderPanel(); renderPreview(); scheduleSave();
    return;
  }
  const ink = await getInk(draftTpl());
  detected = ink ? analyzeRegion(ink, {x,y,w,h}) : null;
  renderOverlay(); renderBadges();
  openNewFieldDialog(detected || {
    mask:{x,y,w,h}, text:{x:Math.round(x+w/2), y:Math.round(y+h/2)},
    orientation:0, fontSize:30, tolPosition:"right", tolBox:null, auto:false
  });
}

/* ---------- 底圖墨跡分析 ---------- */
const inkCache = new Map();
async function getInk(tpl){
  const key = tpl.asset.src;
  if (inkCache.has(key)) return inkCache.get(key);
  let res = null;
  try{
    const { img } = await loadImage(key);
    const cv = document.createElement("canvas");
    cv.width = tpl.asset.w; cv.height = tpl.asset.h;
    const ctx = cv.getContext("2d", { willReadFrequently:true });
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const d = ctx.getImageData(0,0,cv.width,cv.height).data;
    const ink = new Uint8Array(cv.width*cv.height);
    for (let i=0,j=0; j<ink.length; i+=4, j++){
      ink[j] = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) < 120 ? 1 : 0;
    }
    res = { w:cv.width, h:cv.height, ink };
  }catch(err){ res = null; }   // 畫布被封鎖時不做辨識，退回手動填寫
  inkCache.set(key, res);
  return res;
}

// 在框選範圍內找出文字墨跡：去除貫穿直線 → 連通元件 → 依字高分出主尺寸與公差
function analyzeRegion(ink, box){
  const x0 = clamp(box.x,0,ink.w-1), y0 = clamp(box.y,0,ink.h-1);
  const w = clamp(box.w,1,ink.w-x0), h = clamp(box.h,1,ink.h-y0);
  const g = new Uint8Array(w*h);
  for (let j=0;j<h;j++)
    for (let i=0;i<w;i++)
      g[j*w+i] = ink.ink[(y0+j)*ink.w + (x0+i)];

  // 去掉貫穿框內的長直線（尺寸線、輪廓線）
  for (let i=0;i<w;i++){ let c=0; for (let j=0;j<h;j++) c+=g[j*w+i];
    if (c >= 0.72*h) for (let j=0;j<h;j++) g[j*w+i]=0; }
  for (let j=0;j<h;j++){ let c=0; for (let i=0;i<w;i++) c+=g[j*w+i];
    if (c >= 0.72*w) for (let i=0;i<w;i++) g[j*w+i]=0; }

  // 連通元件（8 鄰接）
  const seen = new Uint8Array(w*h), comps = [], stack = new Int32Array(w*h);
  for (let s=0;s<g.length;s++){
    if (!g[s] || seen[s]) continue;
    let sp=0; stack[sp++]=s; seen[s]=1;
    let minx=w, maxx=-1, miny=h, maxy=-1, area=0;
    while (sp){
      const k = stack[--sp], ky = (k/w)|0, kx = k - ky*w;
      area++;
      if (kx<minx) minx=kx; if (kx>maxx) maxx=kx;
      if (ky<miny) miny=ky; if (ky>maxy) maxy=ky;
      for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++){
        const nx=kx+dx, ny=ky+dy;
        if (nx<0||ny<0||nx>=w||ny>=h) continue;
        const nk = ny*w+nx;
        if (g[nk] && !seen[nk]){ seen[nk]=1; stack[sp++]=nk; }
      }
    }
    if (area >= 5) comps.push({ x:minx, y:miny, w:maxx-minx+1, h:maxy-miny+1, area });
  }
  if (!comps.length) return null;

  // 以「長軸」判斷字級，明顯較小的元件視為公差
  const axis = c=> Math.max(c.w, c.h);
  const sorted = comps.map(axis).sort((a,b)=>a-b);
  const med = sorted[Math.floor(sorted.length/2)];
  const small = comps.filter(c=> axis(c) < med*0.72);
  const main  = comps.filter(c=> axis(c) >= med*0.72);
  const use = main.length ? main : comps;

  const bboxOf = (arr)=>{
    const x1=Math.min(...arr.map(c=>c.x)), y1=Math.min(...arr.map(c=>c.y));
    const x2=Math.max(...arr.map(c=>c.x+c.w)), y2=Math.max(...arr.map(c=>c.y+c.h));
    return { x:x0+x1, y:y0+y1, w:x2-x1, h:y2-y1 };
  };
  const valBox = bboxOf(use);
  const allBox = bboxOf(comps);

  const vertical = valBox.h > valBox.w*1.35;
  const orientation = vertical ? -90 : 0;

  // 字級：主元件長軸中位數 ÷ 數字字高比例
  const mainAxis = use.map(axis).sort((a,b)=>a-b);
  const fontSize = clamp(Math.round(mainAxis[Math.floor(mainAxis.length/2)] / 0.72), 8, 120);

  // 公差位置：小元件相對主尺寸的方位
  let tolPosition = "right", tolBox = null;
  if (small.length >= 2){
    tolBox = bboxOf(small);
    const tcx = tolBox.x + tolBox.w/2, tcy = tolBox.y + tolBox.h/2;
    const vcx = valBox.x + valBox.w/2, vcy = valBox.y + valBox.h/2;
    if (vertical) tolPosition = (tcx < vcx) ? "above" : "right";
    else tolPosition = (tcy < vcy - valBox.h*0.35) ? "above" : "right";
  }

  const m = 4;
  return {
    mask: { x:Math.max(0,allBox.x-m), y:Math.max(0,allBox.y-m), w:allBox.w+2*m, h:allBox.h+2*m },
    text: { x:Math.round(valBox.x+valBox.w/2), y:Math.round(valBox.y+valBox.h/2) },
    orientation, fontSize, tolPosition,
    tolBox: small.length>=2 ? tolBox : null,
    hasTol: small.length>=2,
    auto: true
  };
}

const MAX_UPLOAD = 25*1024*1024;

// 前綴下拉：資料裡若有清單外的舊值，保留成一個選項免得被改掉
function prefixOptions(cur){
  const opts = PREFIXES.slice();
  if (cur && !opts.some(([v])=> v===cur)) opts.push([cur, cur]);
  return opts.map(([v,label])=>
    `<option value="${esc(v)}"${v===(cur||"")?" selected":""}>${esc(label)}</option>`).join("");
}

const selectOptions = (list, cur, blank)=>
  [`<option value="">${esc(blank)}</option>`]
    .concat(list.map(v=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(v)}</option>`))
    .join("");

function openAddTemplate(){
  openModal("新增底圖",
    `<div class="msg info">選一張圖面當底圖，建立一筆新範本。建立後用「設定範本 → 框選新尺寸」`+
    `逐一建立可填欄位，不需要改程式。<br>`+
    `支援 PNG／JPEG／WebP。<b>TIF 瀏覽器無法直接讀取</b>，請先批次轉成 JPEG 再上傳。</div>`+
    `<div class="set-body" style="padding:0">`+
      `<button class="btn" type="button" id="atPick">選擇圖檔…</button>`+
      `<div class="prefix-hint" id="atFileInfo">尚未選擇檔案</div>`+
      `<div><label for="at-name">圖面名稱／圖號</label><input id="at-name" type="text" placeholder="例如 B-K01-5.40x73"></div>`+
      `<div class="g2">`+
        `<div><label for="at-machine">車台</label><select id="at-machine">${selectOptions(MACHINES,"","（未指定）")}</select></div>`+
        `<div><label for="at-part">類型</label><select id="at-part">${selectOptions(PART_TYPES,"","（未指定）")}</select></div>`+
      `</div>`+
      `<div><label for="at-material">材質（填入試作圖框）</label><input id="at-material" type="text" placeholder="例如 碳化鎢 VA70 1PC ／ 模殼 SKD11 1PC"></div>`+
    `</div>`,
    `<button class="btn" type="button" id="atCancel">取消</button>`+
    `<button class="btn primary" type="button" id="atOk" disabled>建立範本</button>`);

  let picked = null;   // {blob, w, h, name}
  $("atCancel").addEventListener("click", closeModal);
  $("atPick").addEventListener("click", ()=> $("imgInput").click());

  $("imgInput").onchange = async (e)=>{
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    const info = $("atFileInfo");
    if (/tiff?$/i.test(f.name) || f.type==="image/tiff"){
      info.innerHTML = `<span style="color:var(--warn)">TIF 無法直接使用，請先轉成 JPEG 或 PNG。</span>`;
      return;
    }
    if (f.size > MAX_UPLOAD){
      info.innerHTML = `<span style="color:var(--warn)">檔案 ${(f.size/1048576).toFixed(1)}MB 超過 25MB 上限。</span>`;
      return;
    }
    info.textContent = "讀取中…";
    try{
      const url = await blobToDataURL(f);
      const img = new Image();
      await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
      picked = { blob:f, w:img.naturalWidth, h:img.naturalHeight, name:f.name };
      info.innerHTML = `${esc(f.name)}　${img.naturalWidth} × ${img.naturalHeight} px　${(f.size/1024).toFixed(0)}KB`
        + (img.naturalWidth*img.naturalHeight > 40e6 ? `<br><span style="color:var(--warn)">影像很大，輸出與縮放會比較慢。</span>` : "");
      if (!$("at-name").value) $("at-name").value = f.name.replace(/\.[^.]+$/,"");
      $("atOk").disabled = false;
    }catch(err){
      info.innerHTML = `<span style="color:var(--warn)">這個檔案無法解碼，請換成 JPEG 或 PNG。</span>`;
      picked = null; $("atOk").disabled = true;
    }
  };

  $("atOk").addEventListener("click", async ()=>{
    if (!picked) return;
    const name = ($("at-name").value.trim() || picked.name.replace(/\.[^.]+$/,""));
    const machine = $("at-machine").value, partType = $("at-part").value;
    const uploadId = uid("img");
    try{ await store.putUpload(uploadId, picked.blob); }
    catch(err){ toast("圖檔存入本機失敗："+(err&&err.message||"未知錯誤"),"warn"); return; }
    checkpoint();
    const t = {
      id: uid("tpl"), name, machine, partType, typeGroup: "", typeCode: "",
      asset: { src:"upload:"+uploadId, w:picked.w, h:picked.h },
      info: { drawNo:name, material:$("at-material").value.trim(), rev:"R0", note:"" },
      // 預設圖框放在圖面下緣，之後可用「框選圖框範圍」調整
      frameRegion: { x:Math.round(picked.w*0.03), y:Math.round(picked.h*0.855),
                     w:Math.round(picked.w*0.94), h:Math.round(picked.h*0.125) },
      extraMasks: [], fields: [], version: 1
    };
    ws.templates[t.id] = t;
    ws.drafts[t.id] = newDraft(t);
    ws.ui.currentTemplateId = t.id;
    ws.ui.selectedFieldId = null;
    ws.ui.machineFilter = ""; ws.ui.partFilter = "";
    ws.ui.mode = "set";
    closeModal(); renderAll(); scheduleSave();
    toast("範本已建立。接著用「框選新尺寸」建立可填欄位，並用「框選圖框範圍」確認試作圖框的位置。","ok");
  });
}

function removeTemplate(){
  const t = curTpl();
  const snaps = ws.saved.filter(s=>s.draft.templateId===t.id).length;
  openModal("移除範本",
    `<div class="msg warn">將移除範本「${esc(t.name)}」、它的工作草稿`+
    (snaps?`，以及 ${snaps} 筆已存圖面`:"")+
    `。可用「復原」返回。</div>`+
    (t.asset.src.indexOf("upload:")===0
      ? `<div class="msg info">上傳的底圖檔也會一併從本機刪除。</div>`
      : `<div class="msg info">內建底圖檔不會刪除，清空本機資料後會重新出現。</div>`),
    `<button class="btn" type="button" id="rtCancel">取消</button><button class="btn primary" type="button" id="rtOk">移除</button>`);
  $("rtCancel").addEventListener("click", closeModal);
  $("rtOk").addEventListener("click", async ()=>{
    checkpoint();
    const id = t.id, src = t.asset.src;
    delete ws.templates[id];
    delete ws.drafts[id];
    ws.saved = ws.saved.filter(s=>s.draft.templateId!==id);
    const rest = Object.keys(ws.templates);
    if (!rest.length){
      closeModal();
      toast("已移除最後一筆範本，請先新增底圖。","info");
      ws.ui.currentTemplateId = null;
      renderAll(); scheduleSave();
      return;
    }
    ws.ui.currentTemplateId = rest[0];
    ws.ui.selectedFieldId = draftTpl().fields[0]?.id || null;
    if (src.indexOf("upload:")===0){ try{ await store.delUpload(src.slice(7)); }catch(e){} }
    imageCache.delete(src); inkCache.delete(src);
    closeModal(); renderAll(); scheduleSave();
  });
}

function saveTemplateVersion(){
  checkpoint();
  const d = curDraft();
  const t = clone(d.template);
  t.version = (ws.templates[d.templateId]?.version || 0) + 1;
  // 以目前草稿的實際值作為新的預設值
  t.fields.forEach(f=>{
    const v = d.values[f.id];
    if (v){ f.defaultValue=v.value; f.defaultTolUpper=v.tolUpper; f.defaultTolLower=v.tolLower; }
  });
  t.info = clone(d.info);
  ws.templates[d.templateId] = t;
  d.template = clone(t);
  renderAll(); scheduleSave();
  toast("已保存為範本 v"+t.version+"。既有其他草稿與舊快照不受影響。","ok");
}
