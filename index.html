    `<span style="display:flex;gap:6px"><button class="btn sm primary" type="button" data-open="${esc(s.id)}">開啟</button>`+
    `<button class="btn sm" type="button" data-rm="${esc(s.id)}">刪除</button></span></li>`).join("");
  openModal("開啟已存圖面",
    `<div class="msg warn">開啟會直接取代該範本目前的工作草稿，沒有額外確認；可用「復原」返回。重要草稿請先另存。</div>`+
    `<ul class="snap-list">${rows}</ul>`, "");
  $("modalHost").querySelectorAll("[data-open]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const snap = ws.saved.find(s=>s.id===btn.getAttribute("data-open"));
      if (!snap) return;
      checkpoint();
      ws.drafts[snap.draft.templateId] = clone(snap.draft);
      ws.ui.currentTemplateId = snap.draft.templateId;
      ws.ui.selectedFieldId = snap.draft.template.fields[0]?.id || null;
      ws.ui.compare = false;
      closeModal(); renderAll(); scheduleSave();
    });
  });
  $("modalHost").querySelectorAll("[data-rm]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      checkpoint();
      ws.saved = ws.saved.filter(s=>s.id!==btn.getAttribute("data-rm"));
      closeModal(); renderBadges(); scheduleSave();
      if (ws.saved.length) openSnapshots();
    });
  });
}

/* ==========================================================================
   11. 輸出
   ========================================================================== */

// 存檔：優先用平台的下載能力（線上檢視時），否則退回瀏覽器下載連結（本機使用時）
let downloadsNs;   // undefined=尚未詢問, null=不可用
async function getDownloads(){
  if (downloadsNs !== undefined) return downloadsNs;
  try{
    downloadsNs = (window.claude && typeof window.claude.use==="function")
      ? await window.claude.use("downloads") : null;
  }catch(e){ downloadsNs = null; }
  return downloadsNs;
}
async function offerFile(filename, data){
  const d = await getDownloads();
  if (d){
    try{ await d.save({ filename, data }); return "saved"; }
    catch(err){ if (err && err.code==="declined") return "declined"; }
  }
  try{
    const blob = (data instanceof Blob) ? data : new Blob([data]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return "local";
  }catch(e){ return "unavailable"; }
}
function saveNote(outcome, filename){
  if (outcome==="saved")    return `<div class="msg ok">已存檔：${esc(filename)}</div>`;
  if (outcome==="declined") return `<div class="msg info">已取消存檔。</div>`;
  return `<div class="msg info">若瀏覽器未自動下載 ${esc(filename)}，請用下方內容自行存檔。</div>`;
}
async function composeCanvas(){
  const d = clone(curDraft());               // 固定這次輸出的內容
  const { img } = await loadImage(d.template.asset.src);
  const plan = buildPlan(d, { original:false });
  await (document.fonts?.ready || Promise.resolve());
  return planToCanvas(plan, img);
}

function preflight(){
  const r = validateForOutput(curDraft());
  if (!r.ok){
    openModal("尚未完成必填尺寸",
      `<div class="msg warn">以下必填欄位空白，無法輸出：<ul>${r.missing.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`,
      `<button class="btn" type="button" id="pfOk">回去填寫</button>`);
    $("pfOk").addEventListener("click", closeModal);
    return null;
  }
  return r;
}

async function exportPNG(){
  if (busyExport) return;
  const r = preflight(); if (!r) return;
  busyExport = true; $("pngBtn").disabled = true;
  try{
    const cv = await composeCanvas();
    let url, blob;
    try {
      url = cv.toDataURL("image/png");
      blob = await new Promise(res=> cv.toBlob(res, "image/png"));
    }
    catch(e){ toast("無法輸出圖檔：瀏覽器封鎖了畫布讀取。若為本機開啟，請改用本機伺服器（python3 -m http.server）。","warn"); return; }
    const name = ((curDraft().info.drawNo||"drawing")+"_"+(curDraft().info.rev||"R0")+".png").replace(/\s+/g,"");
    const outcome = await offerFile(name, blob || url);
    openModal("PNG 已產生",
      (r.warnings.length?`<div class="msg warn">${r.warnings.map(esc).join("<br>")}</div>`:``)+
      saveNote(outcome, name)+
      `<div class="msg info">解析度 ${cv.width} × ${cv.height}。也可以在下方圖片上按右鍵／長按另存。</div>`+
      `<img src="${url}" alt="輸出預覽">`,
      `<button class="btn" type="button" id="exOk">關閉</button>`);
    $("exOk").addEventListener("click", closeModal);
  }catch(err){
    toast("合成失敗："+(err&&err.message?err.message:"未知錯誤"),"warn");
  }finally{
    busyExport=false; $("pngBtn").disabled=false;
  }
}

async function printSheet(){
  if (busyExport) return;
  const r = preflight(); if (!r) return;
  busyExport = true; $("printBtn").disabled = true;
  try{
    const cv = await composeCanvas();
    let url; try{ url = cv.toDataURL("image/png"); }
    catch(e){ toast("無法列印：瀏覽器封鎖了畫布讀取。請改用本機伺服器開啟。","warn"); return; }
    const landscape = cv.width > cv.height;
    let st = document.getElementById("printPage");
    if (!st){ st=document.createElement("style"); st.id="printPage"; document.head.appendChild(st); }
    st.textContent = `@page{ size:A4 ${landscape?"landscape":"portrait"}; margin:8mm; }`;
    $("printArea").innerHTML = `<img src="${url}" alt="">`;
    const img = $("printArea").querySelector("img");
    await new Promise(res=>{ if (img.complete) res(); else img.onload=res; });
    window.print();
  }catch(err){
    toast("合成失敗："+(err&&err.message?err.message:"未知錯誤"),"warn");
  }finally{
    busyExport=false; $("printBtn").disabled=false;
  }
}

/* ==========================================================================
   12. 備份 / 匯入
   ========================================================================== */
async function exportBackup(){
  const payload = { formatVersion:FORMAT_VERSION, exportedAt:now(),
    templates:ws.templates, drafts:ws.drafts, saved:ws.saved, ui:ws.ui };
  const json = JSON.stringify(payload,null,2);
  const name = "tu-workshop-backup-"+new Date().toISOString().slice(0,10)+".json";
  const outcome = await offerFile(name, json);
  openModal("備份資料",
    saveNote(outcome, name)+
    `<div class="msg info">備份含範本、草稿、已存圖面與畫面狀態，<b>不含底圖 JPG</b>。換電腦時請一併保留整個專案資料夾。</div>`+
    `<textarea id="bkText" readonly>${esc(json)}</textarea>`,
    `<button class="btn" type="button" id="bkCopy">複製到剪貼簿</button><button class="btn primary" type="button" id="bkOk">關閉</button>`);
  $("bkOk").addEventListener("click", closeModal);
  $("bkCopy").addEventListener("click", async ()=>{
    const ta=$("bkText"); ta.select();
    try{ await navigator.clipboard.writeText(ta.value); $("bkCopy").textContent="已複製"; }
    catch(e){ document.execCommand?.("copy"); $("bkCopy").textContent="已複製"; }
  });
}

function validateBackup(obj){
  const err = [];
  if (!obj || typeof obj!=="object") return ["檔案內容不是有效的 JSON 物件"];
  if (obj.formatVersion!==FORMAT_VERSION) err.push("格式版本不符（需要 "+FORMAT_VERSION+"）");
  if (!obj.templates || typeof obj.templates!=="object") err.push("缺少 templates");
  if (!obj.drafts || typeof obj.drafts!=="object") err.push("缺少 drafts");
  if (!Array.isArray(obj.saved)) err.push("saved 必須是陣列");
  if (err.length) return err;
  Object.values(obj.templates).forEach(t=>{
    if (!t.asset || !t.asset.src) err.push("範本 "+(t.id||"?")+" 缺少底圖引用");
    if (!Array.isArray(t.fields)) { err.push("範本 "+(t.id||"?")+" 欄位格式錯誤"); return; }
    t.fields.forEach(f=>{
      if (!f.id || !f.mask || !f.text) err.push("範本 "+t.id+" 的欄位資料不完整");
      else if ([f.mask.x,f.mask.y,f.mask.w,f.mask.h,f.text.x,f.text.y].some(n=>typeof n!=="number" || !isFinite(n)))
        err.push("範本 "+t.id+" 欄位 "+f.id+" 座標不是有效數字");
    });
  });
  obj.saved.forEach((s,i)=>{
    if (!s || !s.draft || !s.draft.template) err.push("第 "+(i+1)+" 筆已存圖面結構不完整");
  });
  return err;
}

function importBackupText(text){
  let obj;
  try{ obj = JSON.parse(text); }
  catch(e){ toast("無法解析 JSON："+e.message,"warn"); return; }
  const errs = validateBackup(obj);
  if (errs.length){
    openModal("備份格式不符，未匯入",
      `<div class="msg warn"><ul>${errs.slice(0,10).map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`,
      `<button class="btn" type="button" id="ivOk">關閉</button>`);
    $("ivOk").addEventListener("click", closeModal);
    return;
  }
  openModal("確認匯入",
    `<div class="msg warn">這是整批取代，不是合併匯入。目前工作區的範本、草稿與已存圖面都會被覆蓋（本次頁面工作階段內可復原）。</div>`+
    `<div class="msg info">將匯入：範本 ${Object.keys(obj.templates).length} 筆 · 草稿 ${Object.keys(obj.drafts).length} 筆 · 已存圖面 ${obj.saved.length} 筆</div>`,
    `<button class="btn" type="button" id="imCancel">取消</button><button class="btn primary" type="button" id="imOk">取代工作區</button>`);
  $("imCancel").addEventListener("click", closeModal);
  $("imOk").addEventListener("click", ()=>{
    checkpoint();
    ws = { formatVersion:FORMAT_VERSION, templates:obj.templates, drafts:obj.drafts, saved:obj.saved,
      ui: Object.assign({ currentTemplateId:Object.keys(obj.templates)[0], mode:"fill", selectedFieldId:null,
        machineFilter:"", partFilter:"", zoom:1, compare:false }, obj.ui||{}) };
    if (!ws.templates[ws.ui.currentTemplateId]) ws.ui.currentTemplateId = Object.keys(ws.templates)[0];
    if (!ws.drafts[ws.ui.currentTemplateId]) ws.drafts[ws.ui.currentTemplateId] = newDraft(ws.templates[ws.ui.currentTemplateId]);
    ws.ui.compare=false;
    imageCache.clear();
    closeModal(); renderAll(); scheduleSave();
    toast("已匯入備份。","ok");
  });
}

function openImport(){
  openModal("匯入備份",
    `<div class="msg info">選擇備份 JSON 檔，或直接貼上內容。匯入會先檢查格式與座標，通過後才要求確認。</div>`+
    `<button class="btn" type="button" id="imPick">選擇備份檔…</button>`+
    `<div style="margin-top:10px"><label for="imText">或貼上備份 JSON</label><textarea id="imText"></textarea></div>`,
    `<button class="btn" type="button" id="imClose2">取消</button><button class="btn primary" type="button" id="imPaste">檢查並匯入</button>`);
  $("imClose2").addEventListener("click", closeModal);
  $("imPick").addEventListener("click", ()=> $("fileInput").click());
  $("imPaste").addEventListener("click", ()=>{
    const t=$("imText").value.trim();
    if (!t){ $("imText").focus(); return; }
    importBackupText(t);
  });
}
$("fileInput").addEventListener("change", async (e)=>{
  const f = e.target.files && e.target.files[0];
  e.target.value="";
  if (!f) return;
  if (f.size > 12*1024*1024){ toast("備份檔超過 12MB，已拒絕匯入。","warn"); return; }
  importBackupText(await f.text());
});

$("tabFill").addEventListener("click", ()=>{ if(ws.ui.mode==="fill")return; ws.ui.mode="fill"; cancelMarquee(); renderPanel(); renderPreview(); scheduleSave(); });
$("tabSet").addEventListener("click", ()=>{ if(ws.ui.mode==="set")return; ws.ui.mode="set"; renderPanel(); renderPreview(); scheduleSave(); });
$("addTplBtn").addEventListener("click", openAddTemplate);
$("machineFilter").addEventListener("change", (e)=>{ ws.ui.machineFilter=e.target.value; renderTemplateList(); scheduleSave(); });
$("partFilter").addEventListener("change", (e)=>{ ws.ui.partFilter=e.target.value; renderTemplateList(); scheduleSave(); });
$("compareChk").addEventListener("change", (e)=>{ ws.ui.compare=e.target.checked; renderPreview(); renderBadges(); scheduleSave(); });
$("zoomIn").addEventListener("click", ()=> setZoom(ws.ui.zoom+0.25));
$("zoomOut").addEventListener("click", ()=> setZoom(ws.ui.zoom-0.25));
$("zoomFit").addEventListener("click", fitWidth);
$("undoBtn").addEventListener("click", undo);
$("backupBtn").addEventListener("click", exportBackup);
$("importBtn").addEventListener("click", openImport);
$("saveSnapBtn").addEventListener("click", saveSnapshot);
$("openSnapBtn").addEventListener("click", openSnapshots);
$("pngBtn").addEventListener("click", exportPNG);
$("printBtn").addEventListener("click", printSheet);

(async function boot(){
  let freshStart = true;
  try{
    const saved = await store.get();
    if (saved && saved.formatVersion===FORMAT_VERSION && saved.templates && Object.keys(saved.templates).length){
      ws = saved;
      if (!ws.templates[ws.ui?.currentTemplateId]) ws.ui.currentTemplateId = Object.keys(ws.templates)[0];
      ws.ui.compare = false;
      setSaveState("saved","已保存到本機");
      freshStart = false;
    } else {
      setSaveState("idle","尚未保存");
    }
  }catch(e){
    setSaveState("error","本機保存無法使用");
  }
  renderAll();
  if (freshStart) setTimeout(fitWidth, 60);   // 首次開啟先讓整張圖看得到
  $("undoBtn").disabled = true;
})();

})();
</script>
